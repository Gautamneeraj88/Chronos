global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'chronos-orchestrator'
    static_configs:
      - targets: ['host.containers.internal:3001']
    metrics_path: '/metrics'

  - job_name: 'chronos-worker'
    static_configs:
      - targets: ['host.containers.internal:3002']
    metrics_path: '/metrics'

  - job_name: 'chronos-gateway'
    static_configs:
      - targets: ['host.containers.internal:3000']
    metrics_path: '/metrics'
