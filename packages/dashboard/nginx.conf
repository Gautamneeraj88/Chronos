server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver is injected at container start by docker-entrypoint.sh from
    # /etc/resolv.conf — works on both Docker (127.0.0.11) and Podman (varies).
    resolver __RESOLVER__ valid=30s ipv6=off;

    # Health check endpoint — always available, no upstream dependency
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # API proxy — avoids CORS issues in production
    location /api/ {
        set $upstream http://chronos-gateway:3000;
        proxy_pass $upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # GraphQL proxy
    location /graphql {
        set $upstream http://chronos-gateway:3000;
        proxy_pass $upstream/graphql;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
