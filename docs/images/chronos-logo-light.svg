<svg width="680" height="200" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arr-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- background: transparent (white shown here for reference) -->
<rect width="680" height="200" rx="16" fill="#ffffff"/>

<!-- ── Clock mark ── -->
<g transform="translate(100,100)">

  <!-- Rings -->
  <circle cx="0" cy="0" r="68" fill="none" stroke="#1D9E75" stroke-width="2" opacity="0.3"/>
  <circle cx="0" cy="0" r="54" fill="none" stroke="#1D9E75" stroke-width="1" opacity="0.18"/>

  <!-- Tick marks -->
  <g stroke="#1D9E75" stroke-width="2" stroke-linecap="round" opacity="0.45">
    <line x1="0"   y1="-68" x2="0"   y2="-58"/>
    <line x1="0"   y1="58"  x2="0"   y2="68"/>
    <line x1="-68" y1="0"   x2="-58" y2="0"/>
    <line x1="58"  y1="0"   x2="68"  y2="0"/>
    <line x1="-48" y1="-48" x2="-41" y2="-41"/>
    <line x1="41"  y1="41"  x2="48"  y2="48"/>
    <line x1="-48" y1="48"  x2="-41" y2="41"/>
    <line x1="41"  y1="-41" x2="48"  y2="-48"/>
  </g>

  <!-- Clock hands -->
  <line x1="0" y1="0" x2="32" y2="-30" stroke="#1D9E75" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="0" y1="0" x2="0"  y2="-38" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <circle cx="0" cy="0" r="3" fill="#1D9E75" opacity="0.65"/>

  <!-- DAG edges -->
  <line x1="-34" y1="18"  x2="-6"  y2="-26" stroke="#1D9E75" stroke-width="1.8" fill="none" marker-end="url(#arr-light)" opacity="0.8"/>
  <line x1="10"  y1="-26" x2="28"  y2="14"  stroke="#1D9E75" stroke-width="1.8" fill="none" marker-end="url(#arr-light)" opacity="0.8"/>
  <line x1="-26" y1="24"  x2="24"  y2="24"  stroke="#1D9E75" stroke-width="1.2" fill="none" marker-end="url(#arr-light)" opacity="0.4"/>

  <!-- Node A — start -->
  <circle cx="-36" cy="22" r="10" fill="#E8F7F2" stroke="#1D9E75" stroke-width="2"/>
  <circle cx="-36" cy="22" r="4"  fill="#1D9E75"/>

  <!-- Node B — intermediate (diamond) -->
  <g transform="translate(0,-30) rotate(45)">
    <rect x="-8" y="-8" width="16" height="16" fill="#EEECFB" stroke="#7F77DD" stroke-width="2"/>
  </g>
  <circle cx="0" cy="-30" r="3" fill="#7F77DD"/>

  <!-- Node C — complete -->
  <circle cx="34" cy="22" r="10" fill="#E8F7F2" stroke="#1D9E75" stroke-width="2"/>
  <circle cx="34" cy="22" r="5.5" fill="#1D9E75"/>
  <circle cx="34" cy="22" r="2.2" fill="#ffffff"/>

</g>

<!-- ── Wordmark ── -->
<text
  x="204" y="114"
  font-family="Arial, Helvetica, sans-serif"
  font-size="58"
  font-weight="500"
  fill="#1A1F2E"
  letter-spacing="-1">Chronos</text>

<text
  x="207" y="140"
  font-family="Arial, Helvetica, sans-serif"
  font-size="13"
  font-weight="400"
  fill="#1D9E75"
  letter-spacing="3.5"
  opacity="0.85">WORKFLOW ORCHESTRATION</text>

</svg>
