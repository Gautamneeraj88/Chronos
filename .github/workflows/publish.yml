name: Publish Docker Images

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/gautamneeraj88/chronos

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: api-gateway
            context: .
            dockerfile: packages/api-gateway/Dockerfile
          - service: orchestrator
            context: .
            dockerfile: packages/orchestrator/Dockerfile
          - service: worker
            context: .
            dockerfile: packages/worker/Dockerfile
          - service: notifier
            context: .
            dockerfile: packages/notifier/Dockerfile
          - service: dashboard
            context: .
            dockerfile: packages/dashboard/Dockerfile
          - service: grafana
            context: infra/grafana
            dockerfile: infra/grafana/Dockerfile
          - service: prometheus
            context: infra/prometheus
            dockerfile: infra/prometheus/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=/api
            VITE_GRAFANA_URL=http://localhost:3004
            VITE_JAEGER_URL=http://localhost:16686
